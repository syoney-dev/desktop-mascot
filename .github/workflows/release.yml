# Windows 用インストーラーをビルドして、GitHub のリリースに載せる。
# Actions の「release」→「Run workflow」で実行すると、package.json の version で
# v<version> のタグとリリースを作る。説明文は .github/release-notes/v<version>.md。
name: release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist -- --publish never  # 載せるのは下の gh で行う
      - name: リリースを作ってインストーラーを載せる
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          gh release create "$tag" dist/Hakomaru-Setup-*.exe \
            --target "$GITHUB_SHA" --title "ハコまる $tag" \
            --notes-file ".github/release-notes/$tag.md"
