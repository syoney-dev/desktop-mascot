# v* のタグを push すると、Windows 用インストーラーをビルドしてリリースに載せる。
# リリースの説明文は、タグ（git tag -a）のメッセージがそのまま使われる。
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: タグのメッセージを取ってくる
        run: git fetch --force origin "refs/tags/${{ github.ref_name }}:refs/tags/${{ github.ref_name }}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run dist
      - name: リリースを作ってインストーラーを載せる
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${{ github.ref_name }}" dist/Hakomaru-Setup-*.exe \
            --title "ハコまる ${{ github.ref_name }}" --notes-from-tag
