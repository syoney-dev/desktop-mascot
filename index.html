<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'">
  <title>ハコまる</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background: transparent;
      user-select: none;
      -webkit-user-select: none;
    }
    canvas {
      display: block;
      image-rendering: pixelated;
    }
  </style>
</head>
<body>
  <canvas id="stage"></canvas>
  <!-- キャラ（スキン）。renderer.js より先に読み込む -->
  <script src="skins/hakomaru.js"></script>
  <script src="skins/nyanmaru.js"></script>
  <script src="renderer.js"></script>
</body>
</html>
